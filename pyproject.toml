[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "git-updater"
version = "0.1.0"
description = "Catalog git clones, pin SHAs in vendor.lock, replicate stacks."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "git-updater contributors" }]

[project.scripts]
git-updater = "git_updater:main"

[tool.setuptools]
py-modules = ["git_updater"]

