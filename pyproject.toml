[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vand"
version = "0.1.0"
description = "Catalog source instances, pin revisions in vand.lock, replicate stacks."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "vand contributors" }]

[project.scripts]
vand = "vand:main"

[tool.setuptools]
py-modules = ["vand"]

