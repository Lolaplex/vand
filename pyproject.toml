[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vend"
version = "0.1.0"
description = "Catalog source instances, pin revisions in vend.lock, replicate stacks."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "vend contributors" }]

[project.scripts]
vend = "vend:main"

[tool.setuptools]
py-modules = ["vend"]

