[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vand"
version = "1.0.0"
description = "Materialize and pin source instances; origins.lock provenance and source.yml manifests."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Lolaplex" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control",
]

[project.urls]
Homepage = "https://github.com/Lolaplex/vand"
Repository = "https://github.com/Lolaplex/vand"

[project.scripts]
vand = "vand:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
